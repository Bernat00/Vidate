openapi: 3.0.3

info:
  title: Vidate Backend API
  version: 1.0.0
  description: >
    REST API for the Vidate backend. WebSocket signaling uses /ws/main.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string

    Token:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string

    UserCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required: [email, password]

    UserEdit:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
        password:
          type: string
          format: password
          nullable: true
        old_password:
          type: string
          format: password
      required: [old_password]

    UserOut:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        disabled:
          type: boolean

    UserMe:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        disabled:
          type: boolean
        is_onboarded:
          type: boolean
        role_name:
          type: string

    UserAdmin:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        disabled:
          type: boolean
        role_id:
          type: integer
        is_onboarded:
          type: boolean

    ResetEmail:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    PasswordReset:
      type: object
      properties:
        password:
          type: string
          format: password
      required: [password]

    SetBan:
      type: object
      properties:
        user_id:
          type: string
        value:
          type: boolean
      required: [user_id, value]

    ReportCreate:
      type: object
      properties:
        reported_user_id:
          type: string
        reason:
          type: string
      required: [reported_user_id, reason]

    Report:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
        reporter_id:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    ReportedUserReport:
      type: object
      properties:
        id:
          type: integer
        reporter_email:
          type: string
          format: email
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    ReportSummaryItem:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        disabled:
          type: boolean
        report_count:
          type: integer

    ReportSummaryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReportSummaryItem"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Language:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    Religion:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    Gender:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    ProfileRead:
      type: object
      properties:
        user_id:
          type: string
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        birth_date:
          type: string
          format: date-time
        gender_id:
          type: integer
        religion_id:
          type: integer
          nullable: true
        is_smoker:
          type: boolean
        wants_children:
          type: boolean
          nullable: true
        gender:
          $ref: "#/components/schemas/Gender"
        religion:
          $ref: "#/components/schemas/Religion"
        languages:
          type: array
          items:
            $ref: "#/components/schemas/Language"

    ProfileCreate:
      type: object
      properties:
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        birth_date:
          type: string
          format: date-time
        gender_id:
          type: integer
        language_ids:
          type: array
          items:
            type: integer
        religion_id:
          type: integer
          nullable: true
        is_smoker:
          type: boolean
        wants_children:
          type: boolean
          nullable: true
      required:
        - first_name
        - last_name
        - birth_date
        - gender_id
        - language_ids
        - is_smoker

    PreferenceCreate:
      type: object
      properties:
        age_min:
          type: integer
          nullable: true
        age_max:
          type: integer
          nullable: true
        wants_children:
          type: boolean
          nullable: true
        is_smoker:
          type: boolean
          nullable: true
        gender_ids:
          type: array
          items:
            type: integer
          nullable: true
        language_ids:
          type: array
          items:
            type: integer
          nullable: true
        religion_ids:
          type: array
          items:
            type: integer
          nullable: true

    PreferenceRead:
      type: object
      properties:
        user_id:
          type: string
        age_min:
          type: integer
          nullable: true
        age_max:
          type: integer
          nullable: true
        wants_children:
          type: boolean
          nullable: true
        is_smoker:
          type: boolean
          nullable: true
        genders:
          type: array
          items:
            $ref: "#/components/schemas/Gender"
        languages:
          type: array
          items:
            $ref: "#/components/schemas/Language"
        religions:
          type: array
          items:
            $ref: "#/components/schemas/Religion"

    Match:
      type: object
      properties:
        id:
          type: integer
        timestamp:
          type: string
          format: date-time
        confirmed:
          type: boolean
        user1_id:
          type: string
        user2_id:
          type: string

    MatchResponse:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/ProfileRead"
        matched_at:
          type: string
          format: date-time
        match_id:
          type: integer
        last_message:
          type: string
          nullable: true
        last_message_at:
          type: string
          format: date-time
          nullable: true

    FeedbackRequest:
      type: object
      properties:
        partner_id:
          type: string
        liked:
          type: boolean
      required: [partner_id, liked]

    ChatEventOut:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        match_id:
          type: integer
        originator_id:
          type: string
        recipient_id:
          type: string
        timestamp:
          type: string
          format: date-time
        content:
          type: string
          nullable: true
        end_time:
          type: string
          format: date-time
          nullable: true

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created
        "400":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/register-admin:
    post:
      summary: Register a new admin user
      tags: [auth]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/token:
    post:
      summary: Login and receive a JWT
      tags: [auth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required: [username, password]
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/register-admin-token:
    get:
      summary: Generate one-time admin registration token
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token string
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/me:
    get:
      summary: Get current user
      tags: [user]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMe"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update current user
      tags: [user]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserEdit"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOut"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users:
    get:
      summary: List all users
      tags: [user]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAdmin"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/report:
    post:
      summary: Report another user
      tags: [user]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreate"
      responses:
        "201":
          description: Report created
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/ban:
    post:
      summary: Set user ban status
      tags: [user]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBan"
      responses:
        "200":
          description: Ban updated
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/reports:
    get:
      summary: Get all reports
      tags: [user]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/reports/{user_id}:
    get:
      summary: Get reports for a user
      tags: [user]
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportedUserReport"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/reported-summary:
    get:
      summary: Get reported users summary
      tags: [user]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: disabled
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummaryResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/send-reset-email:
    post:
      summary: Send password reset email
      tags: [user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetEmail"
      responses:
        "200":
          description: Email sent
        "404":
          description: User does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/reset-password:
    post:
      summary: Reset password
      tags: [user]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReset"
      responses:
        "200":
          description: Password reset
        "403":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/profile/mine:
    get:
      summary: Get authenticated user's profile
      tags: [profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileRead"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update authenticated user's profile
      tags: [profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCreate"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileRead"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/profile/languages:
    get:
      summary: List all languages
      tags: [profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Languages returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"
    post:
      summary: Create a new language
      tags: [profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Language"
      responses:
        "200":
          description: Language created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Language"
    delete:
      summary: Delete a language
      tags: [profile]
      security:
        - bearerAuth: []
      parameters:
        - name: language_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "404":
          description: Language not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update a language
      tags: [profile]
      security:
        - bearerAuth: []
      parameters:
        - name: language_id
          in: query
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Language"
      responses:
        "200":
          description: Language updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Language"

  /api/profile/religions:
    get:
      summary: List all religions
      tags: [profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Religions returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Religion"
    post:
      summary: Create a new religion
      tags: [profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Religion"
      responses:
        "200":
          description: Religion created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Religion"
    delete:
      summary: Delete a religion
      tags: [profile]
      security:
        - bearerAuth: []
      parameters:
        - name: religion_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "404":
          description: Religion not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update a religion
      tags: [profile]
      security:
        - bearerAuth: []
      parameters:
        - name: religion_id
          in: query
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Religion"
      responses:
        "200":
          description: Religion updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Religion"

  /api/profile/genders:
    get:
      summary: List all genders
      tags: [profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Genders returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gender"
    post:
      summary: Create a new gender
      tags: [profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Gender"
      responses:
        "200":
          description: Gender created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gender"
    delete:
      summary: Delete a gender
      tags: [profile]
      security:
        - bearerAuth: []
      parameters:
        - name: gender_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "404":
          description: Gender not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/preferences:
    get:
      summary: Get preferences
      tags: [preferences]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenceRead"
        "404":
          description: Preferences not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update preferences
      tags: [preferences]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferenceCreate"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenceRead"

  /api/matches/mine:
    get:
      summary: List matches for current user
      tags: [matches]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchResponse"

  /api/matches/match-profile/{partner_id}:
    get:
      summary: Get matched profile by partner id
      tags: [matches]
      security:
        - bearerAuth: []
      parameters:
        - name: partner_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "404":
          description: Match profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/matches/match:
    post:
      summary: Create or confirm a match
      tags: [matches]
      security:
        - bearerAuth: []
      parameters:
        - name: userid
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete a match
      tags: [matches]
      security:
        - bearerAuth: []
      parameters:
        - name: match_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "404":
          description: Match not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/matches/{match_id}/events:
    get:
      summary: Get match chat events
      tags: [matches]
      security:
        - bearerAuth: []
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: integer
        - name: last_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatEventOut"
        "403":
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Match not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/matches/feedback:
    post:
      summary: Submit match feedback
      tags: [matches]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "200":
          description: Feedback processed

  /api/matches/feedback-profile/{partner_id}:
    get:
      summary: Get feedback profile for partner
      tags: [matches]
      security:
        - bearerAuth: []
      parameters:
        - name: partner_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileRead"
        "400":
          description: No conversation found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

